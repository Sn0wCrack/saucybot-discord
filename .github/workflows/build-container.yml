name: 'Build Container'

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push to container registry'
        required: false
        type: boolean
        default: false
      configuration:
        description: '.NET build configuration'
        required: false
        type: string
        default: 'Release'
      tags:
        description: 'Docker image tags'
        required: false
        type: string
        default: ''
      labels:
        description: 'Docker image labels'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to build'
        required: false
        type: string
        default: ''

env:
  HUSKY: 0
  DOTNET_VERSION: '10.x'

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-26.04'

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 'Setup Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 'Login to Container Registry'
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 'Build and Push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: ${{ inputs.push }}
          file: ./SaucyBot/Containerfile
          context: ./SaucyBot
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: CONFIGURATION=${{ inputs.configuration }}
