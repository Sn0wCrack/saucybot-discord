name: 'Build Container'

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push to container registry'
        required: false
        type: boolean
        default: false
      configuration:
        description: '.NET build configuration'
        required: false
        type: string
        default: 'Release'
      tags:
        description: 'Docker image tags'
        required: false
        type: string
        default: ''
      labels:
        description: 'Docker image labels'
        required: false
        type: string
        default: ''

env:
  HUSKY: 0
  DOTNET_VERSION: '10.x'

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-24.04'

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: 'Setup Buildx'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 'Login to Container Registry'
        if: ${{ inputs.push && github.event_name == 'release' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 'Build and Push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: ${{ inputs.push && github.event_name == 'release' }}
          file: ./SaucyBot/Containerfile
          context: ./SaucyBot
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: CONFIGURATION=${{ inputs.configuration }}
