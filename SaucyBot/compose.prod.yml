services:
  bot:
    build:
      dockerfile: Containerfile
      context: .
      args:
        CONFIGURATION: 'Release'
    env_file:
      - .env
    volumes:
      - ./appsettings.json:/app/appsettings.json
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy
      queue:
        condition: service_healthy
      database:
        condition: service_healthy

  database:
    image: docker.io/library/mariadb:12.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    env_file:
      - .env
    ports:
      - '3306:3306'
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  cache:
    image: docker.io/valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: [ 'valkey-server', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - cache:/data
    restart: unless-stopped
    healthcheck:
      test: '[ $(valkey-cli -h 127.0.0.1 ping) = "PONG" ]'
      timeout: 30s
      retries: 10
      start_period: 10s

  queue:
    image: docker.io/valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: ['valkey-server', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    volumes:
        - queue:/data
    restart: unless-stopped
    healthcheck:
      test: '[ $(valkey-cli -h 127.0.0.1 ping) = "PONG" ]'
      timeout: 30s
      retries: 10
      start_period: 10s

volumes:
  cache:
  database:
